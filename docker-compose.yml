services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - database_network
    restart: unless-stopped

  migrate:
    build:
      dockerfile: Dockerfile
    command: alembic upgrade head
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - database_network

  app:
    build:
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    env_file: .env
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - database_network
    ports:
      - "8000:8000"
    expose:
      - 8000

  worker:
    build:
      dockerfile: Dockerfile
    command: celery -A app.celery_app:celery_app worker --loglevel=INFO --pool=prefork -Q messages,audio,image,video,tts,memory,proactive
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: on-failure
    networks:
      - database_network

  beat:
    build:
      dockerfile: Dockerfile
    command: celery -A app.celery_app:celery_app beat --loglevel=INFO
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: on-failure
    networks:
      - database_network


volumes:
  postgres_data:
  redis_data:
networks:
  database_network:
