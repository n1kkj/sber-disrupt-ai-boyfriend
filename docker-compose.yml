services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - database_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - database_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/startup.sh"]
    volumes:
      - media_storage:/app/storage
      - app_logs:/app/logs
    env_file: .env
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - database_network
    expose:
      - 8000

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - database_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.celery_app:celery_app worker --loglevel=INFO --pool=prefork --concurrency=1 -Q messages,audio,image,video,sticker,tts,proactive,memory
    volumes:
      - media_storage:/app/storage
      - app_logs:/app/logs
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - database_network

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.celery_app:celery_app beat --loglevel=INFO
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - database_network


volumes:
  postgres_data:
  redis_data:
  media_storage:
  app_logs:
networks:
  database_network:
