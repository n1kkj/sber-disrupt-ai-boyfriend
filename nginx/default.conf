limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=telegram_webhook_per_ip:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;
    set $app_upstream http://app:8000;

    client_max_body_size 55m;
    limit_req_status 429;

    location = /api/v1/telegram/webhook {
        limit_req zone=telegram_webhook_per_ip burst=30 nodelay;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
